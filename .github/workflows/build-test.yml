name: Lint & Test
# MAKE SURE SETTINGS > ACTIONS > GENERAL HAS WORKFLOW PERMISSIONS ABLE TO EDIT

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

jobs:
    lint_test:
        name: Lint & Test (Deno)
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4
            
            - name: Setup Deno
              uses: denoland/setup-deno@v1
              with:
                  deno-version: v2.3.1
            - name: Install dependencies
              run: deno install
            
            - name: Check Formatting
              run: deno fmt --check

            - name: Lint Code
              run: deno lint

            - name: Run Tests
              run: deno test --allow-all
    build:
        name: Build
        runs-on: ubuntu-latest
        permissions:
          contents: read
          id-token: write # An OIDC ID token is used for authentication with JSR
        needs: lint_test

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up PNPM
              uses: pnpm/action-setup@v4
              with:
                  version: latest
                  run_install: |
                      - recursive: true
                        args: [--frozen-lockfile, --strict-peer-dependencies]

            - name: Install Node
              uses: actions/setup-node@v4
              with:
                  node-version: '20.x'
                  registry-url: 'https://registry.npmjs.org'
                  cache: "pnpm"

            - name: Build NPM Package
              run: pnpm build
