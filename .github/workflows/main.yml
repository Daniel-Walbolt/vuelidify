name: Build & Publish
# MAKE SURE SETTINGS > ACTIONS > GENERAL HAS WORKFLOW PERMISSIONS ABLE TO EDIT

on:
    release:
        types: [created]

jobs:
    lint_test:
        name: Lint & Test (Deno)
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4
            
            - name: Setup Deno
              uses: denoland/setup-deno@v1
              with:
                  deno-version: v2.3.1

            - name: Install dependencies
              run: deno install

            - name: Check Formatting
              run: deno fmt --check

            - name: Lint Code
              run: deno lint

            - name: Run Tests
              run: deno test --allow-all
    build:
        name: Build
        runs-on: ubuntu-latest
        needs: lint_test

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  ref: 'main'

            - name: Set up PNPM
              uses: pnpm/action-setup@v4
              with:
                  version: latest
                  run_install: |
                      - recursive: true
                        args: [--frozen-lockfile, --strict-peer-dependencies]

            - name: Install Node
              uses: actions/setup-node@v4
              with:
                  node-version: '20.x'
                  registry-url: 'https://registry.npmjs.org'
                  cache: "pnpm"

            - name: Build NPM Package
              run: pnpm build

            - name: Upload build for NPM
              uses: actions/upload-artifact@v4.6.2
              with:
                  name: build-dist # must match the download steps in the publish jobs
                  path: dist
                  if-no-files-found: error
                  retention-days: 1
            - name: Upload for JSR
              uses: actions/upload-artifact@v4.6.2
              with:
                  name: repo # must match the download step in the jsr publish job
                  path: |
                    .
                    !dist
                  if-no-files-found: error
                  retention-days: 1
    publish_npm:
        name: Publish to NPM
        runs-on: ubuntu-latest
        needs: build
        steps:
          - uses: actions/checkout@v4
          - name: Download build artifacts
            uses: actions/download-artifact@v4.3.0
            with:
                name: build-dist
                # not specifying path here downloads into current working directory

          - name: Setup PNPM
            uses: pnpm/action-setup@v4
            with:
                version: latest
          
          - name: Install Node
            uses: actions/setup-node@v4
            with:
                node-version: '20.x'
                registry-url: 'https://registry.npmjs.org'
                cache: "pnpm"

          - name: Publish to NPM
            run: pnpm publish --no-git-checks
            env:
                NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    publish_jsr:
        name: Publish to JSR
        runs-on: ubuntu-latest
        permissions:
          contents: read
          id-token: write # An OIDC ID token is used for authentication with JSR
        needs: build
        steps:
          - name: Download build artifacts
            uses: actions/download-artifact@v4.3.0
            with:
                name: repo
                # not specifying path here downloads into current working directory

          - name: Publish to JSR
            run: npx jsr publish
